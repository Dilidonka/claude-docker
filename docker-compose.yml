services:
  claude-code:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: claude-code:latest
    container_name: claude-code-dev
    stdin_open: true
    tty: true
    volumes:
      # Mount the directory from where the script is called
      - ${WORKSPACE_DIR}:/home/developer/workspace
      # Persist Claude Code authentication files
      - claude-auth:/home/developer/.claude
      # Persist Claude JSON data files
      - claude-data:/home/developer/.claude-data
      # Persist entire .config directory (includes Claude Code config and auth)
      - claude-config:/home/developer/.config
      # Persist .cache directory (Claude Code may store session data here)
      - claude-cache:/home/developer/.cache
      # Persist .local directory (Claude Code may store data here)
      - claude-local:/home/developer/.local
      # Persist npm global packages
      - npm-global:/home/developer/.npm-global
      # Persist bash history
      - bash-history:/home/developer/.bash_history_docker
    environment:
      # Terminal and color support
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - FORCE_COLOR=1
      # MCP and service credentials
      - MYSQL_HOST=${MYSQL_HOST:-localhost}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL}
      - UPSTASH_REDIS_TOKEN=${UPSTASH_REDIS_TOKEN}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
    working_dir: /home/developer/workspace
    network_mode: host 

volumes:
  claude-auth:
  claude-data:
  claude-config:
  claude-cache:
  claude-local:
  npm-global:
  bash-history:
